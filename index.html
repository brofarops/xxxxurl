<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoloLearn Link Shortener</title>
  <script>
    // Support both legacy query links (?PROJECT_ID) and clean path links (/PROJECT_ID/).
    const query = window.location.search.substring(1).trim();
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const lastPathSegment = pathSegments[pathSegments.length - 1] || '';
    // Do not mistake this repository's GitHub Pages base path for a project ID.
    const pathId = lastPathSegment.toLowerCase() === 'xxxxurl' ? '' : lastPathSegment;
    const projectId = /^[a-zA-Z0-9_-]+$/.test(query)
      ? query
      : (/^[a-zA-Z0-9_-]{4,}$/.test(pathId) ? pathId : '');

    if (projectId) {
      window.location.replace(`https://sololearn.com/compiler-playground/${encodeURIComponent(projectId)}/?ref=app`);
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.75rem 0;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    .output {
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: #0f172a;
      border-radius: 8px;
      display: none;
      word-break: break-all;
    }
    .output a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SoloLearn Link Shortener</h1>
    <p>Paste any SoloLearn compiler playground URL to generate a clean short link.</p>

    <input
      type="url"
      id="urlInput"
      placeholder="https://sololearn.com/compiler-playground/WVo1JAV8BIwn/?ref=app"
    />
    <button onclick="shortenUrl()">Shorten Link</button>

    <div id="errorMsg" class="error">Please enter a valid SoloLearn compiler-playground URL.</div>

    <div id="outputBox" class="output">
      <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;">Your short link (copied to clipboard):</div>
      <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <script>
    function shortenUrl() {
      const input = document.getElementById("urlInput").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const outputBox = document.getElementById("outputBox");
      const shortLinkEl = document.getElementById("shortLink");

      errorMsg.style.display = "none";
      outputBox.style.display = "none";

      let parsedUrl;
      try {
        parsedUrl = new URL(input);
      } catch {
        errorMsg.style.display = "block";
        return;
      }

      const match = parsedUrl.hostname.toLowerCase().endsWith("sololearn.com")
        ? parsedUrl.pathname.match(/\/compiler-playground\/([a-zA-Z0-9_-]+)/i)
        : null;

      if (!match || !match[1]) {
        errorMsg.style.display = "block";
        return;
      }

      const projectId = match[1];
      const basePath = window.location.pathname.replace(/\/+$/, "");
      const generatedUrl = `${window.location.origin}${basePath}/${encodeURIComponent(projectId)}/`;

      shortLinkEl.href = generatedUrl;
      shortLinkEl.textContent = generatedUrl;
      outputBox.style.display = "block";
      navigator.clipboard?.writeText(generatedUrl);
    }
  </script>
</body>
</html>

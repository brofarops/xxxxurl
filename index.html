<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoloLearn Link Shortener</title>
  <script>
    // 1. INSTANT REDIRECT LOGIC
    // Runs immediately before the page renders if a query ID is present (e.g., ?WhonPobm5rSW)
    const query = window.location.search.substring(1).trim();
    if (query && /^[a-zA-Z0-9_-]+$/.test(query)) {
      window.location.replace(`https://sololearn.com/compiler-playground/${query}/`);
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.75rem 0;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    .output {
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: #0f172a;
      border-radius: 8px;
      display: none;
      word-break: break-all;
    }
    .output a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SoloLearn Link Shortener</h1>
    <p>Paste any SoloLearn compiler playground URL to generate a clean short link.</p>
    
    <input 
      type="url" 
      id="urlInput" 
      placeholder="https://sololearn.com/compiler-playground/WhonPobm5rSW/?ref=app" 
    />
    <button onclick="shortenUrl()">Shorten Link</button>
    
    <div id="errorMsg" class="error">Please enter a valid SoloLearn compiler-playground URL.</div>
    
    <div id="outputBox" class="output">
      <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;">Your short link (copied to clipboard):</div>
      <a id="shortLink" href="#" target="_blank"></a>
    </div>
  </div>

  <script>
    function shortenUrl() {
      const input = document.getElementById("urlInput").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const outputBox = document.getElementById("outputBox");
      const shortLinkEl = document.getElementById("shortLink");

      errorMsg.style.display = "none";
      outputBox.style.display = "none";

      // Extract the project ID after /compiler-playground/
      const match = input.match(/sololearn\.com\/compiler-playground\/([a-zA-Z0-9_-]+)/i);

      if (!match || !match[1]) {
        errorMsg.style.display = "block";
        return;
      }

      const projectId = match[1];
      const generatedUrl = `https://brofar-17.github.io/?${projectId}`;

      shortLinkEl.href = generatedUrl;
      shortLinkEl.textContent = generatedUrl;
      outputBox.style.display = "block";

      // Automatically copy to clipboard for convenience
      navigator.clipboard?.writeText(generatedUrl);
    }
  </script>
</body>
</html>
